<section class="appointment-section">
  <h2>Book Your Appointment</h2>
  <p class="subtitle">Please fill in the details below to schedule your visit.</p>

  <form (ngSubmit)="submitAppointment()" #formRef="ngForm" class="appointment-form">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" [(ngModel)]="appointment.name" name="name" required placeholder="Enter your name" />
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" [(ngModel)]="appointment.phone" name="phone" required placeholder="Enter your phone number" pattern="[0-9]{10}" />
    </div>

    <div class="form-group">
      <label>Date</label>
      <input type="date" [(ngModel)]="appointment.date" name="date" required />
    </div>

    <div class="form-group">
      <label>Time Slot</label>
      <select [(ngModel)]="appointment.time" name="time" required>
        <option value="">-- Select a Time Slot --</option>
        <option *ngFor="let slot of ['09:00 AM','10:00 AM','11:00 AM','12:00 PM','01:00 PM','02:00 PM','03:00 PM','04:00 PM','05:00 PM','06:00 PM','07:00 PM','08:00 PM']" [value]="slot">
          {{ slot }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Message (Optional)</label>
      <textarea [(ngModel)]="appointment.message" name="message" rows="3" placeholder="Enter message (optional)"></textarea>
    </div>

    <button type="submit" [disabled]="isSubmitting || !formRef.valid">
      {{ isSubmitting ? 'Booking...' : 'Book Appointment' }}
    </button>

    <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </form>
</section>
